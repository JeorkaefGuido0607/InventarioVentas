          $ref: '#/components/responses/DatosNoDisponible'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    Offset:
      name: offset
      in: path
      required: true
      description: Registros a saltar (0 = primera página)
      schema:
        type: integer
        minimum: 0
      example: 0
    Limit:
      name: limit
      in: path
      required: true
      description: Tamaño de página (1 a 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 10
    Desde:
      name: desde
      in: query
      required: false
      description: 'Fecha inicial AAAA-MM-DD (por defecto: hace 29 días)'
      schema:
        type: string
        format: date
        example: '2026-10-01'
    Hasta:
      name: hasta
      in: query
      required: false
      description: 'Fecha final AAAA-MM-DD (por defecto: hoy)'
      schema:
        type: string
        format: date
        example: '2026-11-30'
    Formato:
      name: formato
      in: query
      required: false
      description: '`csv` descarga el reporte como archivo para Excel'
      schema:
        type: string
        enum:
        - json
        - csv
  responses:
    BadRequest:
      description: El cuerpo no es un JSON válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errores'
    NoAutenticado:
      description: Token inválido, vencido o ausente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol del usuario no tiene permiso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Conflicto con los datos existentes (duplicado, registros asociados, stock)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errores'
    DatosNoDisponible:
      description: La capa de datos no está disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Producto no encontrado.
    Errores:
      type: object
      properties:
        errores:
          type: object
          additionalProperties:
            type: string
          example:
            precio_venta: El precio de venta no puede ser menor que el precio de compra.
    Mensaje:
      type: object
      properties:
        message:
          type: string
          example: Eliminado exitosamente.
    Paginacion:
      type: object
      properties:
        offset:
          type: integer
          example: 0
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 24
    Login:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: administrador
        password:
          type: string
          format: password
          example: Admin2026#
    Sesion:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/Perfil'
    Perfil:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        nombre_completo:
          type: string
        rol_id:
          type: integer
        rol:
          type: string
          enum:
          - Admin
          - Vendedor
          - Bodeguero
    Rol:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 2
        username:
          type: string
          example: vendedor01
        nombre_completo:
          type: string
          example: Daniel Brenes Mora
        correo:
          type: string
          format: email
        rol_id:
          type: integer
          example: 2
        rol:
          type: string
          example: Vendedor
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
    UsuarioCrear:
      type: object
      required:
      - username
      - password
      - nombre_completo
      - correo
      - rol_id
      properties:
        username:
          type: string
          pattern: ^[a-z0-9]{8,16}$
          example: vendedor05
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: Mayúscula, minúscula, número y símbolo (#$@*)
          example: Ventas2026#
        nombre_completo:
          type: string
          minLength: 6
          maxLength: 150
          example: Juan Pérez Mora
        correo:
          type: string
          format: email
          example: juan@inventario.cr
        rol_id:
          type: integer
          example: 2
        activo:
          type: boolean
          default: true
    Categoria:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
          example: Bebidas
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
        productos_count:
          type: integer
          example: 4
    CategoriaCrear:
      type: object
      required:
      - nombre
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 100
          example: Mascotas
        descripcion:
          type: string
          maxLength: 255
        activo:
          type: boolean
    Proveedor:
      type: object
      properties:
        id:
          type: integer
        cedula_juridica:
          type: string
          example: '3101123456'
        nombre:
          type: string
          example: Distribuidora Caribe S.A.
        telefono:
          type: string
          nullable: true
          example: 2758-1020
        correo:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        activo:
          type: boolean
        productos_count:
          type: integer
    ProveedorCrear:
      type: object
      required:
      - cedula_juridica
      - nombre
      properties:
        cedula_juridica:
          type: string
          pattern: ^3[0-9]{9}$
          example: '3101999888'
        nombre:
          type: string
          example: Mascotas del Caribe S.A.
        telefono:
          type: string
          pattern: ^[2-9][0-9]{3}-[0-9]{4}$
          example: 2758-9999
        correo:
          type: string
          format: email
        direccion:
          type: string
          maxLength: 255
        activo:
          type: boolean
    Producto:
      type: object
      properties:
        id:
          type: integer
          example: 6
        codigo:
          type: string
          example: '7441002000010'
        nombre:
          type: string
          example: Café molido 500 g
        descripcion:
          type: string
          nullable: true
        categoria_id:
          type: integer
        categoria_nombre:
          type: string
          example: Bebidas
        proveedor_id:
          type: integer
          nullable: true
        proveedor_nombre:
          type: string
          nullable: true
        precio_compra:
          type: number
          example: 2600
        precio_venta:
          type: number
          example: 3400
        stock:
          type: integer
          example: 22
        stock_minimo:
          type: integer
          example: 8
        stock_bajo:
          type: boolean
        imagen_url:
          type: string
          nullable: true
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
    ProductoCrear:
      type: object
      required:
      - codigo
      - nombre
      - categoria_id
      - precio_compra
      - precio_venta
      properties:
        codigo:
          type: string
          pattern: ^[A-Za-z0-9-]{3,50}$
          example: '7441009000013'
        nombre:
          type: string
          example: Galletas de avena 300 g
        descripcion:
          type: string
        categoria_id:
          type: integer
          example: 6
        proveedor_id:
          type: integer
          example: 5
        precio_compra:
          type: number
          minimum: 0
          example: 900
        precio_venta:
          type: number
          description: Debe ser mayor o igual al precio de compra
          example: 1250
        stock:
          type: integer
          minimum: 0
          description: Stock inicial (queda en la bitácora)
          example: 30
        stock_minimo:
          type: integer
          minimum: 0
          example: 8
        imagen_url:
          type: string
          format: uri
        activo:
          type: boolean
    ProductoActualizar:
      type: object
      description: 'Igual que ProductoCrear, todos opcionales. **No incluye `stock`**: el stock solo cambia con ventas o movimientos.'
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoria_id:
          type: integer
        proveedor_id:
          type: integer
          nullable: true
        precio_compra:
          type: number
        precio_venta:
          type: number
        stock_minimo:
          type: integer
        imagen_url:
          type: string
        activo:
          type: boolean
    Cliente:
      type: object
      properties:
        id:
          type: integer
        cedula:
          type: string
          example: '702340567'
        nombre_completo:
          type: string
          example: Ana Lucía Vargas Sánchez
        telefono:
          type: string
          nullable: true
        correo:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        latitud:
          type: number
          nullable: true
          example: 9.9913
        longitud:
          type: number
          nullable: true
          example: -83.0359
        creado_en:
          type: string
          format: date-time
    ClienteCrear:
      type: object
      required:
      - cedula
      - nombre_completo
      properties:
        cedula:
          type: string
          description: 9 dígitos o DIMEX de 12 iniciando con 1
          example: '703330444'
        nombre_completo:
          type: string
          minLength: 11
          example: María José Brown
        telefono:
          type: string
          example: 8333-4444
        correo:
          type: string
          format: email
        direccion:
          type: string
        latitud:
          type: number
          minimum: -90
          maximum: 90
          description: GPS de la app móvil (junto con longitud)
        longitud:
          type: number
          minimum: -180
          maximum: 180
    LineaVenta:
      type: object
      required:
      - producto_id
      - cantidad
      properties:
        producto_id:
          type: integer
          example: 1
        cantidad:
          type: integer
          minimum: 1
          maximum: 1000
          example: 2
    VentaCrear:
      type: object
      required:
      - detalle
      description: El precio de cada línea lo toma el servidor del catálogo (precio de venta vigente). IVA 13 %.
      properties:
        cliente_id:
          type: integer
          nullable: true
          description: Omitir para cliente de contado
          example: 1
        metodo_pago:
          type: string
          enum:
          - Efectivo
          - Tarjeta
          - SINPE Móvil
          - Transferencia
          default: Efectivo
        descuento_porcentaje:
          type: number
          minimum: 0
          maximum: 50
          default: 0
        observaciones:
          type: string
          maxLength: 255
        detalle:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineaVenta'
    VentaActualizar:
      type: object
      description: Solo campos que no afectan montos ni inventario.
      properties:
        metodo_pago:
          type: string
          enum:
          - Efectivo
          - Tarjeta
          - SINPE Móvil
          - Transferencia
        cliente_id:
          type: integer
          nullable: true
        observaciones:
          type: string
    Venta:
      type: object
      properties:
        id:
          type: integer
          example: 141
        fecha:
          type: string
          format: date-time
        cliente_id:
          type: integer
          nullable: true
        cliente_nombre:
          type: string
          nullable: true
        usuario_id:
          type: integer
        vendedor_nombre:
          type: string
        metodo_pago:
          type: string
        subtotal:
          type: number
          example: 7700
        descuento:
          type: number
          example: 0
        impuesto:
          type: number
          example: 1001
        total:
          type: number
          example: 8701
        estado:
          type: string
          enum:
          - Completada
          - Anulada
        observaciones:
          type: string
          nullable: true
        detalle:
          type: array
          items:
            type: object
            properties:
              producto_id:
                type: integer
              codigo:
                type: string
              producto:
                type: string
              cantidad:
                type: integer
              precio_unitario:
                type: number
              subtotal:
                type: number
    Movimiento:
      type: object
      properties:
        id:
          type: integer
        fecha:
          type: string
          format: date-time
        producto_id:
          type: integer
        producto_codigo:
          type: string
        producto_nombre:
          type: string
        tipo:
          type: string
          enum:
          - Entrada
          - Salida
          - Ajuste
          - Venta
          - Anulación
        cantidad:
          type: integer
        stock_anterior:
          type: integer
        stock_nuevo:
          type: integer
        motivo:
          type: string
        venta_id:
          type: integer
          nullable: true
        usuario_id:
          type: integer
          nullable: true
        usuario_nombre:
          type: string
          nullable: true
    MovimientoCrear:
      type: object
      required:
      - producto_id
      - tipo
      - cantidad
      - motivo
      properties:
        producto_id:
          type: integer
          example: 7
        tipo:
          type: string
          enum:
          - Entrada
          - Salida
          - Ajuste
        cantidad:
          type: integer
          minimum: 0
          description: 'Entrada/Salida: unidades (>0). Ajuste: stock final contado.'
          example: 24
        motivo:
          type: string
          minLength: 3
          example: Compra a Distribuidora Caribe
    Reporte:
      type: object
      properties:
        filtros:
          type: object
        resumen:
          type: object
        data:
          type: array
          items:
            type: object
