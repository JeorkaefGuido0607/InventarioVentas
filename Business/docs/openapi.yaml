        '422':
          $ref: '#/components/responses/Validacion'
        '502':
          $ref: '#/components/responses/DatosNoDisponible'
    put:
      tags:
      - Usuarios
      summary: Actualizar (parcial)
      description: '**Roles:** Admin (no puede cambiar su propio rol ni desactivarse)


        Solo se validan y modifican los campos enviados.'
