openapi: 3.0.3
info:
  title: Inventario y Ventas - Business API
  version: 1.0.0
  description: 'API REST de negocio del Sistema de Inventario y Ventas (Desarrollo de Software IV).


    Arquitectura en capas: **Business** (esta API: controladores, servicios, validadores, JWT y roles) → **Data** (Slim +
    Eloquent, persistencia en MySQL).


    **Autenticación:** `POST /api/auth/login` devuelve un JWT. Envíelo en el encabezado `Authorization: Bearer <token>` (botón
    *Authorize*).


    **Usuarios de prueba:** `administrador / Admin2026#`, `vendedor01 / Ventas2026#`, `bodeguero01 / Bodega2026#`.


    **Formato de errores:** `{ "error": "mensaje" }` o, en validaciones, `{ "errores": { "campo": "mensaje" } }`.'
servers:
- url: http://localhost:9090
  description: Docker local (web_negocio)
security:
- bearerAuth: []
tags:
- name: Autenticación
- name: Usuarios
- name: Categorías
- name: Proveedores
- name: Productos
- name: Clientes
- name: Ventas
- name: Movimientos
- name: Reportes
paths:
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión (obtiene el JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Validacion'
        '502':
          $ref: '#/components/responses/DatosNoDisponible'
  /api/auth/perfil:
    get:
      tags:
      - Autenticación
      summary: Usuario autenticado
      description: '**Roles:** Admin, Vendedor, Bodeguero'
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /api/roles:
    get:
      tags:
      - Usuarios
      summary: Catálogo de roles
      description: '**Roles:** Admin'
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rol'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/usuarios:
    get:
      tags:
      - Usuarios
      summary: Listar usuarios
      description: '**Roles:** Admin'
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '502':
          $ref: '#/components/responses/DatosNoDisponible'
    post:
      tags:
      - Usuarios
      summary: Crear
      description: '**Roles:** Admin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
            example:
              username: vendedor05
              password: Ventas2026#
              nombre_completo: Juan Pérez Mora
              correo: juan@inventario.cr
              rol_id: 2
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '502':
          $ref: '#/components/responses/DatosNoDisponible'
  /api/usuarios/filter/{offset}/{limit}:
    get:
      tags:
      - Usuarios
      summary: Buscar con paginación
      description: '**Roles:** Admin'
      parameters:
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Limit'
      - name: nombre
        in: query
        required: false
        description: Contiene
        schema:
          type: string
      - name: username
        in: query
        required: false
        description: Contiene
        schema:
          type: string
      - name: rol_id
        in: query
        required: false
        description: Rol
        schema:
          type: integer
      - name: activo
        in: query
        required: false
        description: true / false
        schema:
          type: boolean
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  pagination:
                    $ref: '#/components/schemas/Paginacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
